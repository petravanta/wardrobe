<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wardrobe</title>
<meta name="description" content="Your clothes, outfits and what you wore, kept in an open file in your own Google Drive.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip .swatch,.chip .wemoji{margin-right:5px}
.wemoji{font-style:normal}
.word-row input.emoji{width:52px;text-align:center;font-size:18px;padding-inline:4px}
.word-row input[type=text]{max-width:220px}
.word-row input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
/* Wardrobe accent: slate */
:root{--accent:#475569;--accent-ink:#ffffff;--accent-soft:#e5e9ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#a5b4c8;--accent-ink:#10161d;--accent-soft:#222b36}}
:root[data-theme="dark"]{--accent:#a5b4c8;--accent-ink:#10161d;--accent-soft:#222b36}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar select{padding:5px 10px;font-size:14px;border-radius:999px}
.bar .grow{flex:1}
.shelf{margin:0 0 20px}
.shelf h3{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.shelf h3 .count{font-size:12px;font-weight:400;color:var(--muted)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.cs-pal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.cs-pal li{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);line-height:1.25}
.cs-pal i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}
.cs-strip{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.cs-strip i{width:14px;height:18px;display:block}
.cs-opt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.cs-opt input{position:absolute;opacity:0;pointer-events:none}
.cs-opt:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cs-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cs-photo{position:relative;margin:12px 0}
.cs-photo canvas{display:block;width:100%;height:auto;border-radius:var(--r);cursor:crosshair;touch-action:manipulation}
#csDots i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;width:100%}
.card:hover{border-color:var(--muted)}
.card .ph{aspect-ratio:3/4;background:var(--sunk);display:grid;place-items:center;color:var(--faint);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph img.cut{object-fit:contain;padding:8px}
.card .cap{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.card .cap b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap span{font-size:12px;color:var(--muted)}
.card[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:96px}
.thumbs img{width:96px;height:128px;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.thumbs figcaption{font-size:11px;color:var(--muted);text-align:center}
.thumbs img.cut{object-fit:contain;background:repeating-conic-gradient(var(--sunk) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.thumbs .clean{display:block;margin:4px auto 0;font-size:11px;padding:2px 8px}
.thumbs .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;line-height:1}
.minis{display:flex;gap:4px;margin-top:6px}
.minis img,.minis i{width:36px;height:48px;border-radius:4px;object-fit:cover;background:var(--sunk);display:block}
.drop{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--accent) 22%,transparent);border:4px dashed var(--accent);display:grid;place-items:center;pointer-events:none}
.drop p{background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 22px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.fine-only{display:none}
@media (pointer:fine){.fine-only{display:inline}}
.spicy-tag{color:var(--danger)}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{gap:12px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0;margin-bottom:4px}
.sizes .row select,.sizes .row input{flex:1}
</style>

  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="../general/">All apps</a>
      <div class="brand">

<script>
'use strict';
/* Wardrobe. A catalogue of the clothes you own, outfits made from them, and a log of what you wore.
   Built-in knowledge (types, colours, materials, sizes…) comes from data/*.json; items refer to it by id.
   User data follows the "User data" section of petravanta/general STANDARDS.md: one JSON document, a working copy in
   localStorage, optional sync to "Wardrobe data.json" in the user's Google Drive.
   Photos live in this browser (IndexedDB) and, if connected, in a Wardrobe album in the user's Google Photos (GPhotos below). */

/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID = '326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const KEY = 'wardrobe.data', TAB_KEY = 'wardrobe.tab';
const LISTS = ['items', 'outfits', 'wears', 'words'];
const DATASETS = ['types', 'colours', 'materials', 'seasons', 'occasions', 'care', 'size-systems', 'gender-tags', 'colour-seasons', 'colour-quiz'];

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => new Date().toISOString().slice(0, 10);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

/* ---------- Built-in knowledge ---------- */
const K = {}; // K.types = [...], K.byId.types = Map
async function loadKnowledge() {
  K.byId = {};
  await Promise.all(DATASETS.map(async set => {
    const r = await fetch(`data/${set}.json`);
    if (!r.ok) throw new Error(`data/${set}.json: ${r.status}`);
    const key = set.replace(/-(\w)/g, (_, c) => c.toUpperCase());
    K[key] = await r.json(); K.byId[key] = new Map(K[key].map(x => [x.id, x]));
  }));
}
const kname = (set, id) => (K.byId[set].get(id) || { name: id }).name;
const typeGroup = id => { const t = K.byId.types.get(id); return t ? (t.parent || t.id) : null; };
const typeSizeSystems = id => { const t = K.byId.types.get(id) || {}; return t.sizeSystems || (K.byId.types.get(t.parent) || {}).sizeSystems || ['letter']; };

/* ---------- User data ---------- */
function blankDoc() { return { version: 1, settings: { updatedAt: '1970-01-01T00:00:00Z', showSpicy: false, filters: {}, sort: 'added', sortReverse: false, groupBy: '' }, items: [], outfits: [], wears: [], words: [], deleted: [] }; }
// Older or partial documents become the current shape; never write an older format
function upgrade(d) {
  const b = blankDoc();
  if (!d || typeof d !== 'object') return b;
  const out = { ...b, ...d, version: 1, settings: { ...b.settings, ...(d.settings || {}) } };
  LISTS.forEach(l => { out[l] = Array.isArray(d[l]) ? d[l].filter(r => r && r.id) : []; });
  // Imported items once kept their source details under an older field name; move them to item.source
  out.items = out.items.map(r => { if (!r.whering || r.source) return r; const { whering, ...rest } = r; return { ...rest, source: whering }; });
  out.words = out.words.filter(w => typeof w.name === 'string' && w.name.trim());
  out.deleted = Array.isArray(d.deleted) ? d.deleted : [];
  return out;
}
// STANDARDS.md "Merging two copies": by id, newer u wins; deleted ids drop out; newer settings win
function mergeDocs(a, b) {
  a = upgrade(a); b = upgrade(b);
  const deleted = [...new Set([...a.deleted, ...b.deleted])], gone = new Set(deleted);
  const out = { version: 1, settings: (b.settings.updatedAt || '') > (a.settings.updatedAt || '') ? b.settings : a.settings, deleted };
  LISTS.forEach(l => {
    const m = new Map();
    [...a[l], ...b[l]].forEach(r => { const o = m.get(r.id); if (!o || (r.u || '') > (o.u || '')) m.set(r.id, o ? keepMedia(r, o) : r); else m.set(r.id, keepMedia(o, r)); });
    out[l] = [...m.values()].filter(r => !gone.has(r.id));
  });
  return out;
}
// A photo's link to its Google Photos copy is never lost to an older edit made before the upload finished, so it isn't uploaded twice
function keepMedia(win, lose) {
  const ids = new Map((lose.photos || []).filter(p => p.mediaItemId).map(p => [p.id, p]));
  return ids.size ? { ...win, photos: (win.photos || []).map(p => p.mediaItemId || !ids.has(p.id) ? p : { ...p, mediaItemId: ids.get(p.id).mediaItemId, mediaAccount: ids.get(p.id).mediaAccount }) } : win;
}
let doc = upgrade(lsGet(KEY));
function save() { lsSet(KEY, doc); if (store.known) store.save(doc); showSaveState(); GPhotos.soon(); }

const visible = it => doc.settings.showSpicy || !it.spicy;

/* ---------- Wardrobe words ---------- */

// new colour is one record and syncs by u. Items keep word ids in item.words. Deleting a word takes it off every item;
// an id whose word was deleted on another device is skipped, and dropped when that item is next saved.
const WORD_COLOURS = ['#7c3aed', '#db2777', '#dc2626', '#ea580c', '#ca8a04', '#16a34a', '#0d9488', '#2563eb', '#475569', '#1f2937'];
const wordById = id => doc.words.find(w => w.id === id);
const wordByName = n => doc.words.find(w => w.name.toLowerCase() === n.toLowerCase());

const wordsOf = it => (it.words || []).map(wordById).filter(Boolean);
// A word shows its emoji when it has one, otherwise its colour dot
const wordMark = w => w.emoji ? `<i class="wemoji" aria-hidden="true">${esc(w.emoji)}</i>` : `<i class="swatch" style="background:${esc(w.colour || '#888')}"></i>`;
const wordChip = w => `${wordMark(w)}${esc(w.name)}`;
const WORD_EMOJI = ['🖤', '🦇', '🕸️', '💀', '🌹', '⛓️', '🌙', '✨', '🔥', '💜', '🏳️‍⚧️', '🧸', '☕', '🍂', '❄️', '☀️', '🌸', '💼', '🎉', '👠', '🧥', '🌿', '💎', '🚀'];
// Keeps one short emoji (or a few characters) so a pasted sentence can't end up on every chip
const cleanEmoji = v => { const t = String(v || '').trim().split(/\s+/)[0]; if (!t) return ''; const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter().segment(t)].map(x => x.segment) : [...t]; return seg.slice(0, 2).join(''); };
// Returns the word with this name, making it if it's new
function addWord(name) {
  name = String(name || '').trim().replace(/\s+/g, ' '); if (!name) return null;
  const have = wordByName(name); if (have) return have;
  const w = { id: uid(), name, colour: WORD_COLOURS[doc.words.length % WORD_COLOURS.length] }; put('words', w); return w;
}
function deleteWord(id) {
  const t = now();
  doc.items.forEach(it => { if ((it.words || []).includes(id)) { it.words = it.words.filter(x => x !== id); it.u = t; } });
  const f = F(); if ((f.words || []).includes(id)) doc.settings = { ...doc.settings, filters: { ...f, words: f.words.filter(x => x !== id) }, updatedAt: t };

}
// Tags or untags many items at once; only the items shown in the picker change, so hidden spicy items keep their words
function setWordOn(id, shown, on) {
  const t = now();
  shown.forEach(it => { const has = (it.words || []).includes(id); if (has === on.has(it.id)) return; it.words = has ? it.words.filter(x => x !== id) : [...(it.words || []), id]; it.u = t; });
  save();
}

/* ---------- Photos (this browser's copy) ---------- */
// Each item photo is {id, role:'main'|'cutout'|'label', from?, mediaItemId?}; a cut-out's `from` is the photo it was made from. The bytes live in IndexedDB here;
// once uploaded, mediaItemId points at the copy in the Wardrobe album in Google Photos and this is a cache of it.
const Photos = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('wardrobe', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('photos'); r.result.createObjectStore('thumbs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const urls = new Map();
  async function resize(file, max, type = 'image/jpeg', q = .86) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    return new Promise(r => c.toBlob(r, type, q));
  }

    // Every way in (button, drop, later the Picker and camera) goes through here: same resizing, same storage
    async add(file) { const id = uid(); await this.put(id, file); return id; },
    // Also how a photo downloaded from the Google Photos album comes back into this browser's cache
    async put(id, file) {
      const png = file.type === 'image/png';
      const [full, thumb] = await Promise.all([resize(file, 1600, png ? 'image/png' : 'image/jpeg'), resize(file, 400, png ? 'image/png' : 'image/jpeg', .8)]);
      await tx('photos', 'readwrite', s => s.put(full, id)); await tx('thumbs', 'readwrite', s => s.put(thumb, id));
      urls.delete(id);
    },
    async full(id) { return tx('photos', 'readonly', s => s.get(id)).catch(() => null); },
    async thumb(id) {
      if (urls.has(id)) return urls.get(id);
      const b = await tx('thumbs', 'readonly', s => s.get(id)).catch(() => null);
      const u = b ? URL.createObjectURL(b) : ''; urls.set(id, u); return u;
    },
    async drop(id) { await tx('photos', 'readwrite', s => s.delete(id)); await tx('thumbs', 'readwrite', s => s.delete(id)); urls.delete(id); }
  };
})();
const isImage = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(f.name);
const coverPhoto = it => { const p = it.photos || []; return p.find(x => x.role === 'cutout') || p.find(x => x.role === 'main') || p[0]; };
// A photo this browser doesn't have yet (added on another device) comes down from the Google Photos album
async function fillThumbs(root = document) {
  const missing = [];
  for (const img of $$('img[data-photo]', root)) if (!img.getAttribute('src')) {
    const id = img.dataset.photo, u = await Photos.thumb(id) || GPhotos.direct(id), m = mediaIdOf(id);
    if (u) img.src = u; else if (m && GPhotos.live()) missing.push([id, m]); else img.remove();
  }

}
// A photo's album copy, in the Google account Photos is connected to now (mediaAccount says which account it went to)
const inAlbum = p => !!(p && p.mediaItemId && p.mediaAccount && p.mediaAccount === doc.settings.photosAccount);
const mediaIdOf = id => { for (const it of [...doc.items, ...(editing ? [editing] : [])]) for (const p of it.photos || []) if (p.id === id && inAlbum(p)) return p.mediaItemId; return null; };

/* ---------- Clean background (on this device) ---------- */
// The cut-out is a second photo {role:'cutout', from: <the photo it came from>}; the original is always kept. The model
// runs in cutout-worker.js (WebGPU where there is one, otherwise WebAssembly). Photos never leave the device: only the
// model's files are downloaded, the first time, and sw.js keeps them. Imported items may come with their own cut-outs.
const Cutout = (() => {
  let worker = null, seq = 0, chain = Promise.resolve();

    if (worker) return worker;
    worker = new Worker('cutout-worker.js', { type: 'module' });
    worker.onmessage = e => {
      const m = e.data, job = waiting.get(m.id); if (!job) return;
      if (m.progress) return job.progress(m.progress);
      waiting.delete(m.id);
      if (m.error) { job.reject(new Error(m.error)); reset(); } else job.resolve(m.blob);
    };
    worker.onerror = e => { e.preventDefault(); waiting.forEach(j => j.reject(new Error(e.message || 'The model couldn’t load'))); waiting.clear(); reset(); };
    return worker;
  }
  // A failed load stays failed inside the library, so the next try starts a fresh worker
  function reset() { if (worker) worker.terminate(); worker = null; }
  const run = (blob, progress) => new Promise((resolve, reject) => { const id = ++seq; waiting.set(id, { resolve, reject, progress }); w().postMessage({ id, blob }); });
  return {
    supported: typeof Worker === 'function' && typeof OffscreenCanvas === 'function',
    pending: new Set(), // photo ids being cleaned now
    // One at a time: the model is big, and a drop of many photos shouldn't run them all at once
    make(blob, progress = () => {}) { const p = chain.then(() => run(blob, progress)); chain = p.catch(() => {}); return p; }
  };
})();
const autoCutout = () => Cutout.supported && doc.settings.autoCutout !== false;
const mb = n => (n / 1048576).toFixed(0);
async function cleanBackground(itemId, photoId) {
  if (!Cutout.supported || Cutout.pending.has(photoId)) return;
  const src = await Photos.full(photoId); if (!src) return;
  Cutout.pending.add(photoId); refreshThumbs(itemId);
  try {
    const out = await Cutout.make(src, p => {
      if (p.key.startsWith('fetch:/models/') && p.total && p.current < p.total) toast(`Getting the clean-background model (first time only): ${mb(p.current)} of ${mb(p.total)} MB`, 60000);
      else if (p.key === 'compute:inference') toast('Cleaning the background…', 60000);
    });
    const id = await Photos.add(new File([out], 'cutout.png', { type: 'image/png' }));
    toast(attachCutout(itemId, { id, role: 'cutout', from: photoId }) ? 'Background cleaned' : 'Background cleaned, but the item was closed without saving');
  } catch (err) {
    const msg = String(err.message || err);
    toast(`Couldn’t clean the background: ${/fetch|network/i.test(msg) ? 'the model didn’t download. Are you online?' : msg}`, 6000);
  } finally { Cutout.pending.delete(photoId); refreshThumbs(itemId); }
}
// Adds the cut-out to the open form and the saved item, wherever the item is now; a newer cut-out of the same photo replaces the old
function attachCutout(itemId, photo) {
  const old = new Map(), swap = photos => { (photos || []).forEach(p => { if (p.role === 'cutout' && p.from === photo.from) old.set(p.id, { ...old.get(p.id), ...p }); }); return [...(photos || []).filter(p => !(p.role === 'cutout' && p.from === photo.from)), photo]; };
  let used = false;
  if (editing && editing.id === itemId) { editing.photos = swap(editing.photos); used = true; }
  const saved = itemById(itemId);
  if (saved) { put('items', { ...saved, photos: swap(saved.photos) }); used = true; render(); }
  if (!used) Photos.drop(photo.id);
  GPhotos.unlink([...old.values()]);
  old.forEach((p, id) => Photos.drop(id));

/* ---------- Filters ---------- */
// AND across dimensions, OR within one. State lives in settings.filters and syncs.
const F = () => doc.settings.filters || {};
function matches(it, f = F()) {
  if (!visible(it)) return false;
  if (f.group && typeGroup(it.type) !== f.group && it.type !== f.group) return false;
  if (f.families && f.families.length && !(it.colours || []).some(c => f.families.includes((K.byId.colours.get(c) || {}).family))) return false;
  // Androgynous items belong under Masc and Fem too, so either filter finds them
  if (f.gender && f.gender.length) {
    const want = new Set(f.gender); if (want.has('masc') || want.has('fem')) want.add('androgynous');
    if (!(it.gender || []).some(g => want.has(g))) return false;
  }
  const fw = (f.words || []).filter(wordById);
  if (fw.length && !(it.words || []).some(w => fw.includes(w))) return false;
  if (f.size && !(it.sizes || []).some(s => String(s.value).toLowerCase() === f.size.toLowerCase())) return false;
  if (f.spicyOnly && !it.spicy) return false;
  if (f.q) { const q = f.q.toLowerCase(); if (![it.name, it.brand, it.notes, kname('types', it.type), ...wordsOf(it).map(w => w.name)].some(s => s && s.toLowerCase().includes(q))) return false; }
  return true;
}
function setFilter(k, v) { setSetting('filters', { ...F(), [k]: v }); render(); }

/* ---------- Sort and group ---------- */
// The closet's order and shelves. Saved as settings.sort, settings.sortReverse and settings.groupBy, so they sync.
// Each sort has a natural direction (newest, most worn, A to Z); Reverse flips it.
const SORTS = { added: 'Date added', worn: 'Last worn', wears: 'Most worn', name: 'Name', colour: 'Colour', type: 'Type' };
const GROUPS = { '': 'No groups', category: 'Category', type: 'Type', colour: 'Colour', gender: 'Gender', words: 'Wardrobe word', size: 'Size' };
const idx = (list, id) => { const i = list.findIndex(x => x.id === id); return i < 0 ? 1e6 : i; };
// An imported item keeps the date it was first added in its source; items made before 'added' existed keep closet order
const addedAt = it => (it.source && it.source.createdAt) || it.added || '';
function wearStats() {
  const m = new Map(doc.items.map(it => [it.id, { n: (it.source && it.source.wornCount) || 0, last: '' }]));
  const bump = (id, at) => { const s = m.get(id); if (s) { s.n++; if ((at || '') > s.last) s.last = at || ''; } };
  const outfits = new Map(doc.outfits.map(o => [o.id, o.items || []]));
  doc.wears.forEach(w => { if (w.item) bump(w.item, w.at); if (w.outfit) (outfits.get(w.outfit) || []).forEach(id => bump(id, w.at)); });
  return m;
}
function sortItems(items) {
  const by = SORTS[doc.settings.sort] ? doc.settings.sort : 'added', ws = by === 'worn' || by === 'wears' ? wearStats() : null;
  const name = it => (it.name || kname('types', it.type)).toLowerCase(), pos = new Map(doc.items.map((it, i) => [it.id, i]));
  const key = {
    added: (a, b) => addedAt(b).localeCompare(addedAt(a)) || pos.get(b.id) - pos.get(a.id),
    worn: (a, b) => ws.get(b.id).last.localeCompare(ws.get(a.id).last),
    wears: (a, b) => ws.get(b.id).n - ws.get(a.id).n,
    name: () => 0,
    colour: (a, b) => idx(K.colours, (a.colours || [])[0]) - idx(K.colours, (b.colours || [])[0]),
    type: (a, b) => idx(K.types, a.type) - idx(K.types, b.type)
  }[by];
  const out = [...items].sort((a, b) => key(a, b) || name(a).localeCompare(name(b)));
  return doc.settings.sortReverse ? out.reverse() : out;
}
// Returns [{key, label, items}] in a sensible order; items with several colours or gender tags sit on each matching shelf
function groupItems(items) {
  const g = GROUPS[doc.settings.groupBy] ? doc.settings.groupBy : '';
  if (!g) return [{ key: '', label: '', items }];
  const fams = [...new Set(K.colours.map(c => c.family))], letters = (K.byId.sizeSystems.get('letter') || {}).values || [];
  const keysOf = {
    category: it => [typeGroup(it.type) || ''],
    type: it => [it.type || ''],
    colour: it => [...new Set((it.colours || []).map(c => (K.byId.colours.get(c) || {}).family).filter(Boolean))],
    gender: it => it.gender || [],
    words: it => wordsOf(it).map(w => w.id),
    size: it => [...new Set((it.sizes || []).map(z => String(z.value).toUpperCase()))]
  }[g];
  const label = {
    category: k => kname('types', k), type: k => kname('types', k), colour: k => k[0].toUpperCase() + k.slice(1),
    gender: k => K.byId.genderTags.has(k) ? kname('genderTags', k) : k, words: k => { const w = wordById(k); return w ? [w.emoji, w.name].filter(Boolean).join(' ') : k; }, size: k => k
  }[g];
  const rank = {
    category: k => idx(K.types, k), type: k => idx(K.types, k), colour: k => fams.indexOf(k), gender: k => idx(K.genderTags, k), words: () => 0,
    size: k => { const l = letters.indexOf(k); return l >= 0 ? l : isNaN(parseFloat(k)) ? 2e6 : 1e3 + parseFloat(k); }
  }[g];

  items.forEach(it => { const ks = keysOf(it).filter(Boolean); (ks.length ? ks : ['']).forEach(k => { if (!shelves.has(k)) shelves.set(k, []); shelves.get(k).push(it); }); });

  return [...shelves].map(([key, items]) => ({ key, label: key ? label(key) : none, items }))
    .sort((a, b) => (!a.key) - (!b.key) || rank(a.key) - rank(b.key) || a.label.localeCompare(b.label));
}

/* ---------- Colour season ---------- */
// The Colour tab: a guided questionnaire (data/colour-quiz.json), optional photo sampling, and the palette of the chosen
// season (data/colour-seasons.json). Only the season id is saved, as settings.colourSeason; answers live in CS while the
// page is open. A face photo is only drawn on the sampler's canvas to read a few colours: it is never saved, uploaded,
// put in IndexedDB or added to the closet, and it is gone when the sampler closes.
const CS = { answers: {}, from: {}, target: 'skin', samples: {} };
const CS_MATCH = 20; // how close (CIE76 ΔE) an item's main colour must be to a palette swatch to count as in the palette
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function rgbLab([r, g, b]) {

// The average of every answered question on each axis, and the seasons nearest to it
function csScores() {
  const acc = { warmth: [0, 0], depth: [0, 0], clarity: [0, 0] };

  K.colourQuiz.forEach(q => { const o = q.options.find(x => x.id === CS.answers[q.id]); if (!o) return; n++; for (const a in acc) if (typeof o[a] === 'number') { acc[a][0] += o[a]; acc[a][1]++; } });
  const out = { n }; for (const a in acc) out[a] = acc[a][1] ? acc[a][0] / acc[a][1] : 0;
  return out;
}
const csRank = sc => K.colourSeasons.map(s => ({ s, d: Math.hypot(s.traits.warmth - sc.warmth, s.traits.depth - sc.depth, s.traits.clarity - sc.clarity) })).sort((a, b) => a.d - b.d);
const csLean = sc => [sc.warmth > 0.25 ? 'warm' : sc.warmth < -0.25 ? 'cool' : 'neutral', sc.depth > 0.3 ? 'deep' : sc.depth < -0.3 ? 'light' : 'medium depth', sc.clarity > 0.3 ? 'bright' : sc.clarity < -0.3 ? 'soft' : 'medium clarity'];

function csCloset(s) {

  doc.items.filter(visible).forEach(it => {
    const c = K.byId.colours.get((it.colours || [])[0]);
    if (!c || c.family === 'pattern') return out.other.push(it);
    const l = labOf(c.hex), g = Math.min(...good.map(x => dE(l, x))), b = Math.min(Infinity, ...bad.map(x => dE(l, x)));

const csSwatches = list => `<ul class="cs-pal">${list.map(c => `<li><i style="background:${esc(c.hex)}"></i><span>${esc(c.name)}</span></li>`).join('')}</ul>`;

const CS_GUIDE = 'This is a guide, not a verdict. Light, cameras, make-up and hair dye all change how colours read, and the season systems themselves are a rule of thumb. Hold a few colours from the top suggestions under your face in daylight and keep the one you look best in.';

  const top = csRank(sc).slice(0, 3), cur = doc.settings.colourSeason;
  return `<h3>Suggestion</h3><p>Your answers lean <b>${csLean(sc).join(', ')}</b>.</p>
    <div class="stack cs-picks">${top.map((x, i) => `<div class="row cs-pick"><b>${esc(x.s.name)}</b><span class="small muted">${i === 0 ? 'Closest' : x.d - top[0].d < 0.25 ? 'Also close' : 'Next closest'}</span>${csStrip(x.s)}<span class="grow"></span>
      ${cur === x.s.id ? '<span class="small muted">Your season</span>' : `<button type="button" class="btn sm${i === 0 ? ' primary' : ''}" data-cs-use="${esc(x.s.id)}">Use this</button>`}</div>`).join('')}</div>
    <p class="small muted">${CS_GUIDE}</p>`;
}
function csQuiz() {
  return `<p class="small muted">Answer what you can, ideally in daylight without make-up, and skip anything you aren't sure of. Your answers aren't saved; only the season you choose is.</p>
    <div class="row"><button type="button" class="btn" data-cs-act="photo">Use a photo to help</button><span class="small muted">It stays on this device and is forgotten when you close it.<span class="fine-only"> You can also drop one here.</span></span></div>
    ${K.colourQuiz.map(q => `<fieldset><legend>${esc(q.question)}</legend>${q.help ? `<p class="small muted">${esc(q.help)}</p>` : ''}
      <div class="chips">${q.options.map(o => `<label class="cs-opt"><input type="radio" name="cs-${esc(q.id)}" value="${esc(o.id)}" data-cs-q="${esc(q.id)}"${CS.answers[q.id] === o.id ? ' checked' : ''}>${o.hex ? `<i class="swatch" style="background:${esc(o.hex)}"></i>` : ''}${esc(o.label)}</label>`).join('')}</div>
      ${CS.from[q.id] ? '<p class="small muted cs-from">Suggested from your photo. Change it if it looks wrong.</p>' : ''}</fieldset>`).join('')}

/* Photo sampling: tap skin, hair and eyes on a photo; the colours suggest answers, which people can still change */
const CS_TARGETS = { skin: 'Skin (cheek)', hair: 'Hair', eyes: 'Eye (iris)', white: 'Something white (optional)' };
function csPhoto(file) {
  if (!isImage(file)) return toast('Only photos can be used (JPEG, PNG, WebP).');
  const url = URL.createObjectURL(file), img = new Image();
  img.onerror = () => { URL.revokeObjectURL(url); toast('This browser can’t read that photo. Try a JPEG or PNG.'); };
  img.onload = () => {
    CS.samples = {}; CS.target = 'skin';
    openDrawer(`<h2>Sample your colouring</h2>
      <p class="small muted">This photo stays on this device. It isn’t saved, uploaded or added to your closet, and it’s forgotten when you close this panel.</p>
      <p class="small">Pick what to sample, then tap that spot on the photo. Daylight from a window, no filter and no make-up give the best reading. Tapping something white lets the app correct for the colour of the light.</p>
      <div class="chips" role="group" aria-label="What to sample">${Object.entries(CS_TARGETS).map(([k, v]) => `<button type="button" class="chip" data-cs-target="${k}" aria-pressed="${k === CS.target}">${v}</button>`).join('')}</div>
      <div class="cs-photo"><canvas id="csCanvas" aria-label="Your photo: tap to sample a colour"></canvas><div id="csDots"></div></div>
      <ul class="cs-pal" id="csSamples"></ul>
      <div class="row" style="margin-top:12px"><button type="button" class="btn primary" data-cs-act="photo-use" id="csUseBtn" disabled>Suggest answers</button><button type="button" class="btn" data-close>Cancel</button></div>`);
    const cv = $('#csCanvas'), k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url); img.src = '';
    cv.addEventListener('click', csSample);
  };
  img.src = url;
}
// The median of a small square around the tap, so a highlight or a stray pixel doesn't decide the colour
function csSample(e) {
  const cv = e.currentTarget, rc = cv.getBoundingClientRect(), x = Math.round((e.clientX - rc.left) * cv.width / rc.width), y = Math.round((e.clientY - rc.top) * cv.height / rc.height);
  const r = Math.max(2, Math.round(Math.max(cv.width, cv.height) / (CS.target === 'eyes' ? 300 : 120)));
  const px = cv.getContext('2d', { willReadFrequently: true }).getImageData(Math.max(0, x - r), Math.max(0, y - r), 2 * r + 1, 2 * r + 1).data, ch = [[], [], []];
  for (let i = 0; i < px.length; i += 4) for (let c = 0; c < 3; c++) ch[c].push(px[i + c]);
  const med = ch.map(a => a.sort((p, q) => p - q)[a.length >> 1]);
  CS.samples[CS.target] = { rgb: med, x: x / cv.width, y: y / cv.height };
  $('#csDots').innerHTML = Object.entries(CS.samples).map(([k, s]) => `<i style="left:${s.x * 100}%;top:${s.y * 100}%;background:${rgbHex(s.rgb)}" title="${esc(CS_TARGETS[k])}"></i>`).join('');
  $('#csSamples').innerHTML = Object.keys(CS_TARGETS).filter(k => CS.samples[k]).map(k => `<li><i style="background:${rgbHex(CS.samples[k].rgb)}"></i><span>${esc(CS_TARGETS[k])}</span></li>`).join('');
  $('#csUseBtn').disabled = !CS.samples.skin;
  const next = Object.keys(CS_TARGETS).find(k => !CS.samples[k]);
  if (next) $(`[data-cs-target="${next}"]`).click();
}
function csApplySamples() {
  const s = CS.samples; if (!s.skin) return;
  // A white sample removes the light's colour cast: scale each channel so the white comes out neutral
  const w = s.white && s.white.rgb, avg = w ? (w[0] + w[1] + w[2]) / 3 : 0;
  const fix = rgb => w ? rgb.map((v, i) => v * Math.min(1.8, Math.max(0.55, avg / Math.max(1, w[i])))) : rgb;
  const lab = {}; ['skin', 'hair', 'eyes'].forEach(k => { if (s[k]) lab[k] = rgbLab(fix(s[k].rgb)); });
  const set = (kind, opt) => { const q = K.colourQuiz.find(x => x.photo === kind); if (q && opt) { CS.answers[q.id] = opt; CS.from[q.id] = true; } };
  const nearest = (kind, l, lightOnly) => { const q = K.colourQuiz.find(x => x.photo === kind); if (!q) return null; return q.options.filter(o => o.hex).map(o => { const ol = labOf(o.hex); return { o, d: lightOnly ? Math.abs(ol[0] - l[0]) : dE(ol, l) }; }).sort((a, b) => a.d - b.d)[0].o.id; };
  set('skin', nearest('skin', lab.skin, true));
  const hue = Math.atan2(lab.skin[2], lab.skin[1]) * 180 / Math.PI; // skin's hue angle: lower is pinker, higher is more golden
  set('undertone', hue > 68 ? 'golden' : hue < 55 ? 'pink' : 'neutral');
  if (lab.hair) set('hair', nearest('hair', lab.hair));
  if (lab.eyes) set('eyes', nearest('eyes', lab.eyes));
  if (lab.hair) { const diff = Math.max(Math.abs(lab.skin[0] - lab.hair[0]), lab.eyes ? Math.abs(lab.skin[0] - lab.eyes[0]) : 0); set('contrast', diff >= 45 ? 'high' : diff < 25 ? 'low' : 'medium'); }
  const cv = $('#csCanvas'); if (cv) cv.width = cv.height = 0; CS.samples = {};
  closeDrawer(); render(); toast('Answers suggested from your photo. Check them, then see the suggestion.', 5000);
  const r = $('#csResult'); if (r) r.scrollIntoView({ block: 'center' });
}

/* ---------- Adding photos: button, drop, one path ---------- */
async function takePhotos(files, target) {
  const all = [...files], imgs = all.filter(isImage), skipped = all.length - imgs.length;
  if (!imgs.length) return toast('Only photos can be added (JPEG, PNG, WebP, HEIC).');
  // A new main photo gets a cut-out made in the background, unless the item has one already (some imports do)
  const clean = [];
  if (target) { // into the item being edited
    for (const f of imgs) {
      const p = { id: await Photos.add(f), role: (target.photos || []).length ? 'label' : 'main' };
      target.photos = [...(target.photos || []), p];
      if (p.role === 'main' && !target.photos.some(x => x.role === 'cutout')) clean.push([target.id, p.id]);
    }
    const cur = readItemForm(target); itemForm({ ...cur, photos: target.photos });
  } else { // one new item per photo; open the first to fill in
    const made = [];
    for (const f of imgs) { const it = newItem(); it.photos = [{ id: await Photos.add(f), role: 'main' }]; it.name = ''; made.push(it); clean.push([it.id, it.photos[0].id]); }
    if (made.length > 1) { made.forEach(it => put('items', it)); render(); }
    itemForm(made[0]);
  }
  if (autoCutout()) clean.forEach(([item, photo]) => cleanBackground(item, photo));
  if (skipped) toast(`Skipped ${skipped} file${skipped > 1 ? 's' : ''} that ${skipped > 1 ? 'aren’t photos' : 'isn’t a photo'}`);
}
let dragDepth = 0;
const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
function dropLabel(n) { return editing ? `Drop to add ${n > 1 ? n + ' photos' : 'the photo'} to ${editing.name || 'this item'}` : `Drop to add ${n > 1 ? n + ' items' : 'an item'} to your closet`; }
addEventListener('dragenter', e => {
  if (!isFileDrag(e)) return; e.preventDefault();
  if (dragDepth++ === 0) { const d = document.createElement('div'); d.className = 'drop'; d.id = 'dropOverlay'; d.innerHTML = `<p>${esc(dropLabel(e.dataTransfer.items ? e.dataTransfer.items.length : 1))}</p>`; document.body.appendChild(d); }
});
addEventListener('dragleave', e => { if (isFileDrag(e) && --dragDepth <= 0) { dragDepth = 0; const d = $('#dropOverlay'); d && d.remove(); } });
addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!isFileDrag(e)) return; e.preventDefault(); dragDepth = 0; const d = $('#dropOverlay'); d && d.remove();
  if ($('#layer').innerHTML && !editing) return toast('Close this panel to add photos');
  takePhotos(e.dataTransfer.files, editing);

// From the user's Google Photos, chosen in Google's picker. Into the item being edited, or one new item per photo.
let picking = false;
async function pickPhotos(target) {
  if (picking) return toast('Google Photos is already open. Choose your photos there.');
  if (!GPhotos.live()) { // this tap opens Google's sign-in, so the picker needs the next one
    try { await GPhotos.renew(); toast('Reconnected to Google Photos. Tap again to choose photos.'); }
    catch (err) { toast(err && err.code === 'offline' ? 'You’re offline' : 'Couldn’t reconnect to Google Photos'); }
    return;
  }
  const win = open('about:blank', '_blank');
  if (!win) return toast('Your browser blocked the Google Photos window. Allow pop-ups for this site and try again.', 6000);
  picking = true; toast('Choose photos in Google Photos, then tap Done', 60000);
  try {
    const { files, failed, videos } = await GPhotos.pick(win, (n, all) => toast(`Getting photos from Google Photos: ${n} of ${all}…`, 60000));
    const skip = [failed && `${failed} Google Photos didn’t let this browser download`, videos && `${videos} video${videos > 1 ? 's' : ''}`].filter(Boolean).join(' and ');
    if (!files.length) return toast(failed ? 'Google Photos didn’t let this browser download the photos, so none were added.' : videos ? 'Only photos can be added, not videos.' : 'No photos chosen', 7000);
    if (target && !(editing && editing.id === target.id)) return toast('The item was closed, so the photos weren’t added. Open it and try again.', 6000);
    await takePhotos(files, target ? editing : null);
    toast(`Added ${files.length} photo${files.length > 1 ? 's' : ''} from Google Photos${skip ? `; skipped ${skip}` : ''}`, 6000);
  } catch (err) {
    const c = err && err.code;
    toast(c === 'cancelled' ? 'No photos chosen' : c === 'timeout' ? 'Google Photos took too long. Try again.' : c === 'offline' ? 'You’re offline'
      : c === 'scopes' ? 'Google Photos didn’t allow choosing photos. In Settings, tap Use another account and leave every permission ticked.'
      : c === 'expired' ? 'The Google Photos sign-in ran out. Tap again to reconnect.' : `Couldn’t get photos from Google Photos${err && err.msg ? ` (${err.msg})` : ''}`, 7000);
  } finally { picking = false; }
}

/* ---------- Import closet file ---------- */
// Reads a closet capture file (item details: brand, type, colours, size, price, fabric, tags…) or a photos-only
// scan file of the person's own closet. Items get Wardrobe's own types, colours, materials and occasions, found through the
// aliases in data/*.json; what has no match stays untouched in item.source, so nothing is lost.
const whFind = (set, name) => { const n = String(name || '').toLowerCase(); return K[set].find(x => x.id === n || (x.aliases || []).includes(n) || x.name.toLowerCase() === n); };
const whSlot = { tops: 'tops', bottoms: 'bottoms', full: 'dresses', outerwear: 'outerwear', footwear: 'shoes', bags: 'bag', accessories: 'accessories' };
const prettyTax = t => String(t || '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
function whSize(sz, footwear) {
  const v = String(sz.size || '').trim(); if (!v) return null;
  const m = v.match(/^(UK|US|EU)\s*(.+)$/i);
  if (m) { const c = m[1].toLowerCase(); return { system: footwear ? 'shoe-' + c : c, value: m[2].trim() }; }
  return { system: /^(x{0,2}s|m|l|x{1,3}l|3xl)$/i.test(v) ? 'letter' : (footwear ? 'shoe-' + (sz.size_country || 'uk') : 'letter'), value: v };
}
function whItem(p) {
  const slot = ((p.size || [])[0] || {}).category, known = whFind('types', p.tax);
  const type = known ? known.id : (whSlot[slot] || 'accessories'), footwear = typeGroup(type) === 'shoes';
  const it = newItem(); it.type = type; it.photos = [];
  const brand = (p.brand || '').trim(), tname = known ? kname('types', type) : prettyTax(p.tax || type);
  it.name = brand ? `${brand} ${tname.toLowerCase()}` : tname;
  const uniq = a => [...new Set(a.filter(Boolean))];
  it.colours = uniq((p.colours || []).map(c => (whFind('colours', c.id) || whFind('colours', c.name) || {}).id));
  it.sizes = (p.size || []).map(z => whSize(z, footwear)).filter(Boolean);
  const g = ((p.size || [])[0] || {}).gender; it.gender = g === 'men' ? ['masc'] : g === 'women' ? ['fem'] : [];
  if (brand) it.brand = brand;
  if (p.price > 0) it.price = p.price;
  it.materials = uniq((p.fabric || []).map(f => (whFind('materials', f) || {}).id));
  const occ = [...(p.occasions || []), ...(p.season || [])];
  it.seasons = uniq(occ.map(o => (K.byId.seasons.get(o) || {}).id));
  it.occasions = uniq(occ.filter(o => !K.byId.seasons.has(o)).map(o => (whFind('occasions', o) || {}).id));
  if (p.comments) it.notes = p.comments;
  if (!known) it.needsReview = true;
  it.source = { id: p.id, tax: p.tax, imageUrl: p.image_url || undefined, cutoutUrl: p.nobg_image_url || undefined, attributes: p.attributes, styles: p.styles,
    fabric: p.fabric, occasions: p.occasions, colours: (p.colours || []).map(c => c.id), size: p.size, careDetails: p.care_details, favorite: p.is_favorite || undefined,
    wornCount: p.worn_count || undefined, createdAt: p.created_at ? new Date(p.created_at).toISOString() : undefined };
  return it;
}
// The cut-out is fetched straight from the source's image host; the original photo's link is kept, since its host won't allow a copy from here
async function whPhoto(it) {
  const u = it.source.cutoutUrl; if (!u) return;
  try { const r = await fetch(u); if (!r.ok) throw 0; const b = await r.blob(); it.photos = [{ id: await Photos.add(new File([b], 'cutout.png', { type: b.type || 'image/png' })), role: 'cutout' }]; } catch (e) { /* link only */ }
}
async function importCloset(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (d && d.format === 'closet-scan' && Array.isArray(d.items)) return importClosetScan(d);
  if (!d || d.format !== 'closet-capture' || !Array.isArray(d.responses)) return toast('That isn’t a closet capture or scan file');
  const pieces = new Map();
  d.responses.forEach(r => { const b = r.body; if (!b) return; (b.pieces || []).forEach(p => p.id && pieces.set(p.id, { ...pieces.get(p.id), ...p })); if (b.id && b.tax !== undefined) pieces.set(b.id, { ...pieces.get(b.id), ...b }); });
  if (!pieces.size) return toast('No items in that file. Scroll your items list to the end before saving.');
  const have = new Set(doc.items.map(i => i.source && i.source.id).filter(Boolean));
  const todo = [...pieces.values()].filter(p => !have.has(p.id)), skipped = pieces.size - todo.length;
  let added = 0, photoless = 0, review = 0;
  for (let i = 0; i < todo.length; i += 4) {
    const batch = todo.slice(i, i + 4).map(whItem);
    await Promise.all(batch.map(whPhoto));
    batch.forEach(it => { if (!it.photos.length) photoless++; if (it.needsReview) review++; put('items', it); added++; });
    toast(`Importing… ${added} of ${todo.length}`, 60000);
  }
  tab = 'closet'; lsSet(TAB_KEY, tab); render();
  toast(`Imported ${added} item${added === 1 ? '' : 's'}${skipped ? `, skipped ${skipped} already here` : ''}${photoless ? `, ${photoless} without a saved photo` : ''}${review ? `, ${review} with a type to check` : ''}`, 7000);
}
// A scan only has photos and links (no details); kept for pages where the details can't be read
async function importClosetScan(scan) {

   Every app lives on petravanta.github.io and uses the same OAuth client, so a Drive token one app gets works in all of them.
   This keeps that token where every app can see it (localStorage key petravanta.google), one per Google account, so
   reconnecting in one app reconnects them all, and an app only ever uses the token of the account it connected with.
   Google gives a static site no refresh token: a token lasts an hour, and getting a new one opens Google's window,
   which browsers only allow right after a tap. With the account's email as a hint, that window closes by itself. */

  function request(o){return new Promise(async(res,rej)=>{

   Keeps an app's data in one JSON file in the user's Google Drive, at petravanta/<App name>/<file> (drive.file scope: the apps
   only see files they created). A file saved before folders existed is moved there once, on the first connect.

  const set = v => lsSet(KEYP, { ...st(), ...v });
  const S = { busy: false, err: null, ask: 0, timer: null, done: 0, todo: 0 };
  // photo id -> {url, exp}: Google's own address for an album photo this browser doesn't have. Google sends no CORS
  // headers for album images, so another site can show them in <img> but can't copy them into its own storage; the
  // address lasts an hour (Google's baseUrl), after which it is asked for again.
  const direct = new Map();
  const fetching = new Set();
  const known = () => !!st().known && !!GOOGLE_CLIENT_ID;
  const live = () => { const s = st(); return known() && !!s.token && s.exp > Date.now(); };
  const note = () => { if (tab === 'settings' && !$('#layer').innerHTML) render(); };
  if (known()) GoogleToken.gis().catch(() => {});

  // Opens Google's window, so call this from a tap. The Photos account can differ from the Drive one: connecting asks
  // which account to use, and later renewals hint the account chosen then. Resolves the account's email.
  async function signIn(choose) {
    await GoogleToken.gis();
    const r = await new Promise((res, rej) => google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: SCOPES, login_hint: choose ? undefined : st().email || undefined, include_granted_scopes: false, error_callback: rej,
      callback: r => r.error ? rej(r) : google.accounts.oauth2.hasGrantedAllScopes(r, ...NEED) ? res(r) : rej({ code: 'scopes' })
    }).requestAccessToken({ prompt: choose ? 'select_account consent' : '' }));
    const t = { token: r.access_token, exp: Date.now() + (Number(r.expires_in || 3600) - 60) * 1000 };
    let email = '';
    try { email = (await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + t.token } })).json()).email || ''; } catch (e) { }
    if (!choose && st().email && email && email !== st().email) throw { code: 'account' }; // a renewal must stay on the chosen account
    set({ ...t, known: true, email: email || st().email || '' });
    return email;
  }
  // Photos already uploaded belong to the account they went to (photo.mediaAccount). A different account starts a new
  // album, and this browser uploads its photos again there; nothing is removed from the old one.
  function useAccount(email) {
    if (!email || doc.settings.photosAccount === email) return;
    set({ remove: [] });
    doc.settings = { ...doc.settings, photosAccount: email, photosAlbum: '', updatedAt: now() }; save();
  }
  async function call(path, opt = {}) {
    if (!live()) throw { code: 'expired' };
    let r; try { r = await fetch((path.startsWith('https:') ? '' : API) + path, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + st().token } }); } catch (e) { throw { code: 'offline' }; }
    if (r.status === 401) { set({ token: null, exp: 0 }); throw { code: 'expired' }; }
    if (!r.ok) { let msg = ''; try { msg = (await r.json()).error.message; } catch (e) { } throw { code: 'http', status: r.status, msg }; }
    return r;
  }
  const json = (path, body) => call(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  // The album's id is in the synced settings, so every device uses the same album
  async function album() {
    if (doc.settings.photosAlbum) return doc.settings.photosAlbum;
    const a = await json('/albums', { album: { title: 'Wardrobe' } });
    setSetting('photosAlbum', a.id); return a.id;
  }
  function setMediaId(itemId, photoId, mediaItemId) {
    const mark = ps => (ps || []).map(p => p.id === photoId ? { ...p, mediaItemId, mediaAccount: doc.settings.photosAccount } : p);
    const it = itemById(itemId); if (it) put('items', { ...it, photos: mark(it.photos) });
    if (editing && editing.id === itemId) editing.photos = mark(editing.photos);
  }
  // Saved photos not in this account's album yet
  const waiting = () => doc.items.flatMap(it => (it.photos || []).filter(p => !inAlbum(p)).map(p => [it.id, p]));
  async function sync() {
    clearTimeout(S.timer);
    if (!live() || S.busy) return;
    S.busy = true; S.err = null; note();
    try {
      // Removed in the app: out of the album (Google doesn't let apps delete a photo from the library)
      const gone = st().remove || [];
      if (gone.length && doc.settings.photosAlbum) {
        for (let i = 0; i < gone.length; i += 50) await json(`/albums/${doc.settings.photosAlbum}:batchRemoveMediaItems`, { mediaItemIds: gone.slice(i, i + 50) }).catch(e => { if (e.code !== 'http') throw e; });
      }
      set({ remove: [] });
      // Only photos whose bytes are in this browser; the rest were added on another device that uploads them
      const todo = []; for (const [itemId, p] of waiting()) { const blob = await Photos.full(p.id); if (blob) todo.push([itemId, p, blob]); }
      S.todo = todo.length; S.done = 0;
      if (todo.length) {
        const albumId = await album();
        for (let i = 0; i < todo.length; i += 20) { // upload the bytes one by one, then add them to the album 20 at a time
          const chunk = todo.slice(i, i + 20), items = [];
          for (const [, p, blob] of chunk) {
            const token = await (await call('/uploads', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'X-Goog-Upload-Content-Type': blob.type || 'image/jpeg', 'X-Goog-Upload-Protocol': 'raw' }, body: blob })).text();
            items.push({ simpleMediaItem: { uploadToken: token, fileName: `wardrobe-${p.id}.${blob.type === 'image/png' ? 'png' : 'jpg'}` } });
          }
          const r = await json('/mediaItems:batchCreate', { albumId, newMediaItems: items });
          (r.newMediaItemResults || []).forEach((m, k) => { if (m.mediaItem) { setMediaId(chunk[k][0], chunk[k][1].id, m.mediaItem.id); S.done++; } });
          note();
        }
      }
    } catch (e) {
      S.err = e.code === 'expired' ? null : e.code === 'offline' ? 'offline' : (e.msg || 'error');
      // The album was deleted in Google Photos: make a new one next time
      if (e.code === 'http' && e.status === 400 && /album/i.test(e.msg || '')) setSetting('photosAlbum', '');
    } finally { S.busy = false; S.todo = 0; note(); }
  }
  // Photos added elsewhere: shown from the album. pairs: [[photoId, mediaItemId]]
  async function fetchMissing(pairs) {
    pairs = pairs.filter(([id]) => !fetching.has(id)); pairs.forEach(([id]) => fetching.add(id));
    let got = 0;
    for (let i = 0; i < pairs.length; i += 50) {
      const chunk = pairs.slice(i, i + 50);
      let j; try { j = await (await call('/mediaItems:batchGet?' + chunk.map(([, m]) => 'mediaItemIds=' + encodeURIComponent(m)).join('&'))).json(); }
      catch (e) { pairs.slice(i).forEach(([id]) => fetching.delete(id)); break; } // try again on a later render
      for (const [k, r] of (j.mediaItemResults || []).entries()) {
        const m = r.mediaItem; if (!m) continue;
        direct.set(chunk[k][0], { url: m.baseUrl + '=w800-h800', exp: Date.now() + 50 * 60000 }); got++;
      }
    }
    return got;
  }
  // Photos the user already has: Google's Picker. The app can't browse the library; the user chooses photos in a
  // Google Photos window and the app gets only those, for this session. win: a window opened on the tap (browsers block
  // one opened later), sent to the picker once the session exists. Resolves { files, failed }; the bytes come straight
  // to this browser and then go through the same path as any added photo.
  const PICK = 'https://photospicker.googleapis.com/v1';
  const secs = (s, d) => (parseFloat(s) || d);
  async function pick(win, progress) {
    let s;
    try { s = await json(PICK + '/sessions', {}); }
    catch (e) { win.close(); throw e.code === 'http' && e.status === 403 ? { code: 'scopes' } : e; }
    win.location.href = s.pickerUri + '/autoclose';
    try {
      const every = secs(s.pollingConfig && s.pollingConfig.pollInterval, 5) * 1000;
      const until = Date.now() + secs(s.pollingConfig && s.pollingConfig.timeoutIn, 1800) * 1000;
      let closed = 0;
      for (;;) {
        // Check again as soon as the user is back in the app, not only on the timer (background tabs are slowed)
        await new Promise(res => { const t = setTimeout(done, every); function done() { clearTimeout(t); removeEventListener('focus', done); res(); } addEventListener('focus', done); });
        s = await (await call(`${PICK}/sessions/${s.id}`)).json();
        if (s.mediaItemsSet) break;
        if (win.closed && ++closed > 2) throw { code: 'cancelled' }; // closed without choosing
        if (Date.now() > until) throw { code: 'timeout' };
      }
      const picked = []; let page = '';
      do {
        const j = await (await call(`${PICK}/mediaItems?sessionId=${encodeURIComponent(s.id)}&pageSize=100${page ? '&pageToken=' + encodeURIComponent(page) : ''}`)).json();
        picked.push(...(j.mediaItems || [])); page = j.nextPageToken;
      } while (page);
      const photos = picked.filter(m => m.type !== 'VIDEO' && m.mediaFile), files = []; let failed = 0;
      for (const m of photos) {
        progress && progress(files.length + failed + 1, photos.length);
        const b = await bytes(m.mediaFile.baseUrl + '=w2048-h2048');
        if (!b) { failed++; continue; }
        const name = (m.mediaFile.filename || 'photo').replace(/\.[^.]+$/, '') + (b.type === 'image/png' ? '.png' : '.jpg');
        files.push(new File([b], name, { type: b.type, lastModified: Date.parse(m.createTime) || Date.now() }));
      }
      return { files, failed, videos: picked.length - photos.length };
    } finally {
      if (!win.closed) win.close();
      call(`${PICK}/sessions/${s.id}`, { method: 'DELETE' }).catch(() => {});
    }
  }
  // Google asks for the token on the request. If this browser can't send it to Google's image server (CORS), try
  // without it before giving up.
  async function bytes(url) {
    for (const opt of [{ headers: { Authorization: 'Bearer ' + st().token } }, {}]) {
      try { const r = await fetch(url, opt); if (r.ok) { const b = await r.blob(); if (/^image\//.test(b.type)) return b; } console.warn('Google Photos image', r.status, opt.headers ? 'with token' : 'without token'); }
      catch (e) { console.warn('Google Photos image blocked', opt.headers ? 'with token' : 'without token', e); }
    }
    return null;
  }
  // Tokens last an hour. Renew on a tap when close to running out, unless Drive needs this tap (one Google window per tap).
  document.addEventListener('click', e => {
    if (!known() || e.target.closest('[data-gphotos],[data-drive]')) return;
    if ((st().exp || 0) - Date.now() > 10 * 60000 || Date.now() - S.ask < 60000) return;
    const d = GoogleToken.get(lsGet('wardrobe.drive.email'));
    if (store.known && !(d && d.exp - Date.now() > 10 * 60000)) return;
    S.ask = Date.now(); signIn().then(() => { sync(); if (!$('#layer').innerHTML) render(); }).catch(() => note());
  }, true);
  addEventListener('online', () => sync());
  return {
    known, live, sync, fetchMissing, pick, renew: () => signIn(),
    direct(id) {
      const d = direct.get(id); if (!d) return '';
      if (d.exp > Date.now()) return d.url;
      direct.delete(id); fetching.delete(id); return '';
    },
    soon() { if (!live()) return; clearTimeout(S.timer); S.timer = setTimeout(sync, 2000); },
    async connect() {
      const email = await signIn(true), was = doc.settings.photosAccount;
      if (was && email && email !== was && !confirm(`Your photos are in the Wardrobe album of ${was}. Switch to ${email}? A new Wardrobe album is made there, and this browser uploads its photos again. Nothing is deleted from ${was}.`)) { lsSet(KEYP, null); throw { code: 'cancelled' }; }
      useAccount(email); await sync();
    },
    get email() { return st().email || ''; },
    // Photos removed in the app leave the album on the next sync
    unlink(photos) {
      const ids = photos.filter(inAlbum).map(p => p.mediaItemId); if (!ids.length || !known()) return;
      set({ remove: [...new Set([...(st().remove || []), ...ids])] }); this.soon();
    },
    signOut() { lsSet(KEYP, null); direct.clear(); },
    status() {
      const left = waiting().length;
      if (S.busy) return S.todo ? `Uploading photos: ${S.done} of ${S.todo}…` : 'Checking the album…';
      if (S.err === 'offline') return 'Offline · photos upload when you’re back online';
      if (S.err) return `Couldn’t reach Google Photos (${S.err}) · will retry`;
      if (!live()) return left ? `${left} photo${left > 1 ? 's' : ''} waiting · tap anywhere to reconnect` : 'Tap anywhere to reconnect';
      return left ? `${left} photo${left > 1 ? 's' : ''} not in the album yet (added on another device, or still uploading)` : 'All photos are in the album.';
    }
  };
})();
function remoteIn(data) { doc = mergeDocs(doc, data); lsSet(KEY, doc); if (!$('#layer').innerHTML) render(); }
function showSaveState() { $('#saveState').textContent = store.known ? store.status() || 'Saved in this browser' : 'Saved in this browser'; }
addEventListener('storage', e => { if (e.key === KEY && !$('#layer').innerHTML) { doc = upgrade(lsGet(KEY)); render(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.known && store.live() && await store.refresh()) remoteIn(store.data);
});

/* ---------- Start ---------- */
(async () => {
  try { await loadKnowledge(); }
  catch (e) { $('#main').innerHTML = `<div class="empty">Couldn’t load the app’s built-in lists (${esc(e.message)}). Check your connection and reload.</div>`; return; }
  if (store.known && store.data) doc = mergeDocs(doc, store.data);
  render(); showSaveState();
  // Home-screen shortcuts: ?do=add-item, ?do=log-wear
  const act = new URLSearchParams(location.search).get('do');
  if (act) { history.replaceState(null, '', location.pathname); if (act === 'add-item') itemForm(newItem()); if (act === 'log-wear') wearForm(); }
  if (store.known && store.live()) {
    try { doc = mergeDocs(doc, await store.load(false)); lsSet(KEY, doc); store.save(doc); remoteIn(doc); } catch (e) { showSaveState(); }
  }
  GPhotos.sync();
})();
</script>
