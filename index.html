<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wardrobe</title>
<meta name="description" content="Your clothes, outfits and what you wore, kept in an open file in your own Google Drive.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="../general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6.5a2.6 2.6 0 1 1 2.6 2.6c-1 0-2.6.9-2.6 2.4v1.2L4.4 21.5a1.6 1.6 0 0 0 1 2.9h21.2a1.6 1.6 0 0 0 1-2.9L16 12.7" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Wardrobe
      </div>
      <span class="save-state" id="saveState">Saved in this browser</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections" role="tablist">
      <button type="button" role="tab" data-tab="closet" aria-selected="true">Closet</button>
      <button type="button" role="tab" data-tab="outfits">Outfits</button>
      <button type="button" role="tab" data-tab="worn">Worn</button>
      <button type="button" role="tab" data-tab="colour">Colour</button>
      <button type="button" role="tab" data-tab="cosmetics">Make-up</button>
      <button type="button" role="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div data-version-footer></div>
<div id="layer"></div>
<input type="file" id="photoIn" accept="image/*" multiple hidden>
<input type="file" id="backupIn" accept=".json,application/json" hidden>
<input type="file" id="closetIn" accept=".json,application/json" hidden>
<input type="file" id="woreIn" accept="image/*" hidden>
<input type="file" id="csIn" accept="image/*" hidden>
<input type="file" id="cosIn" accept="image/*" multiple hidden>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/tags.js"></script>
<script src="js/photos.js"></script>
<script src="js/cutout.js"></script>
<script src="js/wore.js"></script>
<script src="js/filters.js"></script>
<script src="js/sort.js"></script>
<script src="js/colour.js"></script>
<script src="js/cosmetics.js"></script>
<script src="js/closet.js"></script>
<script src="js/outfits.js"></script>
<script src="js/worn.js"></script>
<script src="js/stats.js"></script>
<script src="js/settings.js"></script>
<script src="js/drawers.js"></script>
<script src="js/zoom.js"></script>
<script src="js/forms.js"></script>
<script src="js/arrange.js"></script>
<script src="js/wears.js"></script>
<script src="js/add-photos.js"></script>
<script src="js/backup.js"></script>
<script src="js/import.js"></script>
<script src="js/events.js"></script>
<script src="js/toast.js"></script>
<script src="js/shared/google-token.js"></script>
<script src="js/shared/drive-store.js"></script>
<script src="js/drive.js"></script>
<script src="js/gphotos.js"></script>
<script src="js/start.js"></script>
<script src="../general/shared/hub-link.js" defer></script>
<script src="../general/shared/theme-switch.js" defer></script>
<script src="../general/shared/version-footer.js" defer></script>
<script>if('serviceWorker' in navigator&&/^(petravanta\.github\.io|localhost|127\.0\.0\.1|[a-z0-9-]+\.[a-z0-9-]+\.ts\.net)$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</body>
</html>
